services:
  api:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3001}:3001"
    environment:
      PORT: "3001"
      JOBS_DIR: /app/jobs
      BODEALER_BIN_DIR: ${BODEALER_BIN_DIR:-/app/exes/linux}
      WALRUS_PATH: ${WALRUS_PATH:-}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-2}
    volumes:
      - jobs:/app/jobs
    restart: unless-stopped
    stop_grace_period: 25s

volumes:
  jobs:
